name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install lightweight client test dependencies
        run: python -m pip install "wsproto>=1.2,<2" "websocket-client>=1.8,<2" "python-socks>=2.7,<3" "ruamel.yaml>=0.18.6,<0.19" "tomlkit>=0.13,<1" "openpyxl>=3.1.5,<4" "defusedxml>=0.7.1,<1" "xlrd>=2.0.1,<3"
      - name: Test client transport and filesystem operations
        run: python -m unittest tests.test_client_imports tests.test_client_reconnect tests.test_client_shell tests.test_mappings tests.test_client_windows tests.test_client_file_api tests.test_git_operations tests.test_structured_rpc tests.test_tabular_rpc -v
      - name: Repeat macOS Git failure regression
        if: runner.os == 'macOS'
        run: >-
          python -c "import sys, unittest; sys.path.insert(0, 'tests');
          from test_git_operations import GitClientTests;
          suite = unittest.TestSuite(GitClientTests('test_policy_output_budget_and_bad_revision') for _ in range(100));
          result = unittest.TextTestRunner(verbosity=1).run(suite);
          sys.exit(not result.wasSuccessful())"
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[client,data-rpc]'

      - name: Compile Python sources
        run: python -m compileall -q openkapsel openkapsel_runtime

      - name: Run tests
        run: python -m unittest discover -s tests -v

  linux-distro:
    name: Linux distro / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8.10
          - almalinux:9.8
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install AlmaLinux Python and Git
        run: dnf install -y git python3.12 python3.12-pip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install --editable '.[client,data-rpc]'

      - name: Compile Python sources
        run: python3.12 -m compileall -q openkapsel openkapsel_runtime

      - name: Run tests
        run: python3.12 -m unittest discover -s tests -v
