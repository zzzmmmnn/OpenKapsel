name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install lightweight client test dependencies
        run: python -m pip install "wsproto>=1.2,<2" "websocket-client>=1.8,<2" "python-socks>=2.7,<3"
      - name: Test client transport and filesystem operations
        run: |
          python -m unittest discover -s tests -p test_mappings.py -v
          python -m unittest discover -s tests -p test_client_windows.py -v
          python -m unittest discover -s tests -p test_client_file_api.py -v
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Compile Python sources
        run: python -m compileall -q openkapsel openkapsel_runtime

      - name: Run tests
        run: python -m unittest discover -s tests -v
