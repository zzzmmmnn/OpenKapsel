name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install lightweight client test dependencies
        run: python -m pip install "wsproto>=1.2,<2" "websocket-client>=1.8,<2" "python-socks>=2.7,<3" "ruamel.yaml>=0.18.6,<0.19" "tomlkit>=0.13,<1" "openpyxl>=3.1.5,<4" "defusedxml>=0.7.1,<1" "xlrd>=2.0.1,<3"
      - name: Test client bootstrap and Windows PowerShell policy on this OS
        run: python -m unittest tests.test_dependency_groups tests.test_setup_client_venv tests.test_windows_powershell_policy tests.test_client_job_sandbox tests.test_path_access -v
      - name: Test client transport and filesystem operations
        run: python -m unittest tests.test_client_imports tests.test_client_config_lock tests.test_client_full_approval tests.test_configured_client_files tests.test_client_reconnect tests.test_client_shell tests.test_mappings tests.test_client_windows tests.test_client_file_api tests.test_git_operations tests.test_structured_rpc tests.test_tabular_rpc -v
      - name: Test function approvals and Local Client contracts
        run: python -m unittest tests.test_function_registry tests.test_function_grants tests.test_file_function_approval tests.test_local_client -v
      - name: Repeat macOS Git failure regression
        if: runner.os == 'macOS'
        run: >-
          python -c "import sys, unittest; sys.path.insert(0, 'tests');
          from test_git_operations import GitClientTests;
          suite = unittest.TestSuite(GitClientTests('test_policy_output_budget_and_bad_revision') for _ in range(100));
          result = unittest.TextTestRunner(verbosity=1).run(suite);
          sys.exit(not result.wasSuccessful())"
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[server,client,data-rpc]'

      - name: Compile Python sources
        run: python -m compileall -q openkapsel openkapsel_runtime

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # This is a separate mandatory integration step: the ordinary suite
      # mocks probe process output and must never be counted as real isolation.
      - name: Install real Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap rootlesskit slirp4netns
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify real Bubblewrap namespace and filesystem isolation
        env:
          OPENKAPSEL_REAL_SANDBOX_TESTS: "1"
        run: >-
          python -m unittest
          tests.test_sandbox_verify.SandboxVerificationTests.test_real_bubblewrap_enforces_private_files_pid_and_readonly -v

      - name: Verify real Job Manager Bubblewrap isolation
        env:
          OPENKAPSEL_REAL_SANDBOX_TESTS: "1"
        run: >-
          python -m unittest
          tests.test_job_sandbox.JobSandboxTests.test_bubblewrap_real_filesystem_network_and_hidden_files -v

      - name: Verify real Client-to-Manager Bubblewrap policy and write grants
        env:
          OPENKAPSEL_REAL_SANDBOX_TESTS: "1"
        run: >-
          python -m unittest
          tests.test_client_job_sandbox.ClientJobSandboxTests.test_linux_short_shell_really_uses_manager_and_write_grants
          tests.test_job_sandbox.JobSandboxTests.test_bubblewrap_cannot_reach_manager_unix_socket -v

  linux-distro:
    name: Linux distro / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8.10
          - almalinux:9.8
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install AlmaLinux Python and Git
        run: dnf install -y git python3.12 python3.12-pip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install --editable '.[server,client,data-rpc]'

      - name: Compile Python sources
        run: python3.12 -m compileall -q openkapsel openkapsel_runtime

      - name: Run tests
        run: python3.12 -m unittest discover -s tests -v

  linux-distro-additional:
    name: Linux distro / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            distro: debian
          - image: opensuse/tumbleweed:latest
            distro: opensuse
          - image: archlinux:latest
            distro: arch
    container:
      image: ${{ matrix.image }}

    steps:
      # Install Git before checkout: minimal distribution images do not ship it.
      - name: Install distribution Python and Git
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.distro }}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                git ca-certificates python3 python3-pip python3-venv
              ;;
            opensuse)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                git ca-certificates python3 python3-pip
              ;;
            arch)
              pacman -Syu --noconfirm --needed \
                git ca-certificates python python-pip
              ;;
          esac
          cat /etc/os-release
          python3 --version

      - name: Check out repository
        uses: actions/checkout@v4

      # Debian/Arch system Python enforces PEP 668. A venv also keeps the
      # installation identical across all three distribution environments.
      - name: Install project in an isolated virtual environment
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable '.[server,client,data-rpc]'

      - name: Check installed package version and compile sources
        shell: bash
        run: |
          .venv/bin/python -c "import importlib.metadata, openkapsel; assert openkapsel.__version__ == importlib.metadata.version('openkapsel')"
          .venv/bin/python -m compileall -q openkapsel openkapsel_runtime

      - name: Run full test suite
        run: .venv/bin/python -m unittest discover -s tests -v
