[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openkapsel"
version = "1.61.0"
description = "Token-scoped remote workspace infrastructure for AI clients"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=41,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "lxml>=4.9,<7",
  "matplotlib>=3.7,<4",
  "numba>=0.57,<1",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pillow>=10,<13",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "wsproto>=1.2,<2",
  "fusepy>=3,<4; sys_platform == 'linux'",
]

[project.optional-dependencies]
client = ["websocket-client>=1.8,<2", "python-socks>=2.7,<3"]
data-rpc = [
  "ruamel.yaml>=0.18.6,<0.19",
  "tomlkit>=0.13,<1",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "xlrd>=2.0.1,<3",
]

[project.scripts]
openkapsel = "openkapsel.server:main"
openkapsel-client = "openkapsel.client:main"

[tool.setuptools.packages.find]
include = ["openkapsel*", "openkapsel_runtime*"]
